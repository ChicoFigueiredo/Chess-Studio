[package]
name = "chess-providers"
description = "Adaptadores tipados (Lichess, Chess.com) sobre a camada de rede por Provedor e a autorização do Lichess (OAuth2 PKCE)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
chess-core.workspace = true
# A Partida online (#230): o retrato do Provedor e a intenção enviada vão ao controlador.
chess-game.workspace = true
# Toda saída de rede passa pelo gate do chess-net; este crate não abre conexão.
chess-net.workspace = true
# Segredos das Conexões (token da autorização do Lichess).
chess-vault.workspace = true
# Ritmo (`Pace`) e Origem/ImportOptions da importação em fluxo da Biblioteca.
chess-store.workspace = true
# Leitor de problemas e instalador de pacotes (CX-16): a baixada reaproveita os do #217.
chess-training.workspace = true
serde.workspace = true
serde_json.workspace = true
# PKCE S256 da autorização do Lichess: SHA-256, base64url e bytes aleatórios do sistema
# (RustCrypto e afins, MIT OR Apache-2.0).
sha2 = "0.11"
base64 = "0.23"
getrandom = "0.4"
zeroize = "1.9"

[dev-dependencies]
chess-net = { workspace = true, features = ["testing"] }
chess-vault = { workspace = true, features = ["testing"] }
# Gera o .csv.zst sintético dos testes de download de problemas (#238).
ruzstd = "0.9.1"

[lints]
workspace = true
