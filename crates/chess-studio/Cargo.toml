[package]
name = "chess-studio"
description = "Aplicativo desktop Chess Studio (Bevy + bevy_egui)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# Recompilação incremental mais rápida em desenvolvimento:
# `cargo run -p chess-studio --features dynamic_linking`.
dynamic_linking = ["bevy/dynamic_linking"]

[dependencies]
chess-core.workspace = true
chess-game.workspace = true
chess-input.workspace = true
chess-store.workspace = true
chess-net.workspace = true
chess-providers.workspace = true
chess-vault.workspace = true
# Senha-mestra e chave pessoal na memória da interface: zeradas ao descartar.
zeroize = "1.9"
chess-uci.workspace = true
chess-pgn.workspace = true
chess-training.workspace = true
chess-openings.workspace = true
bevy = { workspace = true, features = [
    "std",
    "bevy_window",
    "bevy_winit",
    "bevy_log",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_asset",
    "multi_threaded",
    "x11",
    "wayland",
    "tonemapping_luts",
    "bevy_gltf",
    "bevy_scene",
    "bevy_world_serialization",
    "bevy_text",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_anti_alias",
    "bevy_post_process",
    "default_font",
    "reflect_auto_register",
    "jpeg",
    "png",
] }
bevy_egui = { workspace = true, features = ["render"] }
sysinfo = "0.37"
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
wgpu-types = "30"
fluent-bundle = "0.16.0"
unic-langid = "0.9.6"
egui_tiles = { version = "0.17.1", features = ["serde"] }
egui-phosphor = "0.14"
# Hora local (fuso do sistema) para as telas: crate puro em Rust (Unlicense OR MIT), sem `unsafe` no
# nosso código; o fuso é injetável nos testes (src/local_time.rs).
jiff = "0.2"
# Diálogo nativo de abrir/salvar arquivo (MIT): só o portal do desktop no Linux (libdbus carregada
# em tempo de execução, `zenity` de reserva; sem GTK) e os backends nativos de Windows e macOS.
rfd = { version = "0.18", default-features = false, features = ["xdg-portal"] }

[build-dependencies]
# Ícone e nome do app no .exe do Windows (MIT); só age quando o alvo é Windows (build.rs).
winresource = "0.1.34"

[dev-dependencies]
png = "0.18"
# Servidor falso da camada de rede (CX-17): só nos testes, nunca serviço real.
chess-net = { workspace = true, features = ["testing"] }

[lints]
workspace = true

# Instaladores (`cargo packager --release`, ferramenta MIT OR Apache-2.0, não é dependência do app):
# NSIS no Windows, .app/.dmg no macOS, .deb e AppImage no Linux. Caminhos relativos a este diretório.
# Use pelos scripts/package-*.sh, que compilam antes e dão nome aos arquivos em dist/.
[package.metadata.packager]
product-name = "Chess Studio"
identifier = "io.github.chicofigueiredo.chess-studio"
description = "Mesa pessoal de treinamento de xadrez"
long-description = "Tabuleiro 3D e 2D, tres politicas de arbitragem e Engine UCI externa. Funciona offline, sem login."
homepage = "https://github.com/ChicoFigueiredo/Chess-Studio"
authors = ["Chico Figueiredo"]
publisher = "Chico Figueiredo"
copyright = "Chico Figueiredo. MIT OR Apache-2.0"
category = "BoardGame"
binaries = [{ path = "chess-studio", main = true }]
# Ícone provisório (scripts/gerar-icone.py); o .icns e os ícones do Linux saem dos PNGs.
icons = [
    "icons/32x32.png",
    "icons/64x64.png",
    "icons/128x128.png",
    "icons/128x128@2x.png",
    "icons/256x256.png",
    "icons/512x512.png",
    "icons/512x512@2x.png",
    "icons/icon.ico",
]
# Windows: $INSTDIR\assets; macOS: Contents/Resources/assets; Linux: /usr/lib/chess-studio/assets.
resources = [
    "assets",
    "../../LICENSE-MIT",
    "../../LICENSE-APACHE",
    "../../THIRD-PARTY-LICENSES",
]

[package.metadata.packager.macos]
minimum-system-version = "12.0"

[package.metadata.packager.nsis]
# Só para o usuário atual: sem pedir administrador.
installer-mode = "currentUser"
installer-icon = "icons/icon.ico"
languages = ["PortugueseBR"]

[package.metadata.packager.deb]
section = "games"
depends = [
    "libc6",
    "libvulkan1",
    "libxkbcommon0",
    "libxkbcommon-x11-0",
    "libwayland-client0",
    "libudev1",
]
