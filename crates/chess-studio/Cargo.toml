[package]
name = "chess-studio"
description = "Aplicativo desktop Chess Studio (Bevy + bevy_egui)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# Recompilação incremental mais rápida em desenvolvimento:
# `cargo run -p chess-studio --features dynamic_linking`.
dynamic_linking = ["bevy/dynamic_linking"]

[dependencies]
chess-core.workspace = true
chess-game.workspace = true
chess-input.workspace = true
chess-store.workspace = true
chess-uci.workspace = true
chess-training.workspace = true
bevy = { workspace = true, features = [
    "std",
    "bevy_window",
    "bevy_winit",
    "bevy_log",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_asset",
    "multi_threaded",
    "x11",
    "wayland",
    "tonemapping_luts",
    "bevy_gltf",
    "bevy_scene",
    "bevy_world_serialization",
    "bevy_text",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_anti_alias",
    "default_font",
    "reflect_auto_register",
    "jpeg",
    "png",
] }
bevy_egui = { workspace = true, features = ["render"] }
sysinfo = "0.37"
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
wgpu-types = "30"
fluent-bundle = "0.16.0"
unic-langid = "0.9.6"
egui_tiles = { version = "0.17.1", features = ["serde"] }

[lints]
workspace = true
