[package]
name = "chess-uci"
description = "Engine UCI como processo filho: handshake, go/stop, detecção e download fixado"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
chess-core.workspace = true
chess-game.workspace = true
# Download fixado do Stockfish (ADR-0003): HTTP com rustls, SHA-256 e extração.
ureq = { version = "3", default-features = false, features = ["rustls"] }
sha2 = "0.10"
flate2 = "1"
tar = { version = "0.4", default-features = false }
zip = { version = "9", default-features = false, features = ["deflate"] }

[lints]
workspace = true
