[package]
name = "chess-net"
description = "Camada de rede por Provedor: catálogo, consentimento, limites, cache com Origem (ADR-0006)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Servidor HTTP falso e respostas gravadas (CX-17). Só para testes: nenhum crate liga esta
# feature em `[dependencies]` (teste estático em chess-studio/tests/no_network_without_consent.rs).
testing = []

[dependencies]
# Chave de Posição igual à do índice local (Explorador local e de Provedor concordam).
chess-core.workspace = true
# Rede síncrona (CX-20), a mesma do download de Engine: HTTP com rustls, sem runtime assíncrono.
ureq = { version = "3", default-features = false, features = ["rustls"] }
rusqlite.workspace = true
serde.workspace = true

[dev-dependencies]
chess-net = { path = ".", features = ["testing"] }
chess-store.workspace = true
serde_json.workspace = true

[lints]
workspace = true
