name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag do release (ex.: v0.1.0-rc1)'
        required: true
      publicar:
        description: 'Publicar direto, visível a todos (tag com "-" vira pre-release). Desmarcado: só draft.'
        type: boolean
        default: false
      alvo:
        description: 'SHA do commit onde criar a tag (vazio: o commit do workflow). Fora de .github/, o código precisa ser idêntico.'
        required: false
        default: ''

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libudev-dev libasound2-dev libwayland-dev libxkbcommon-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: THIRD-PARTY-LICENSES
        run: |
          cargo install cargo-about --locked --features cli
          scripts/gerar-licencas.sh
      - run: scripts/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.tar.gz
            dist/*.deb
            THIRD-PARTY-LICENSES

  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: .\scripts\package-windows.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip

  macos:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/*.tar.gz
            dist/*.dmg

  release:
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      REPO: ${{ github.repository }}
      PUBLICAR: ${{ github.event.inputs.publicar || 'false' }}
      ALVO: ${{ github.event.inputs.alvo || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Alvo da tag com o mesmo código dos pacotes
        run: |
          ALVO=$(git rev-parse --verify "$ALVO^{commit}")
          echo "ALVO=$ALVO" >> "$GITHUB_ENV"
          # Os pacotes vêm de $GITHUB_SHA; a tag só pode apontar para um commit com o mesmo código.
          if ! git diff --quiet "$ALVO" "$GITHUB_SHA" -- . ':(exclude).github'; then
            git diff --stat "$ALVO" "$GITHUB_SHA" -- . ':(exclude).github'
            echo "::error::$ALVO tem código diferente de $GITHUB_SHA (fora de .github/)"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: artefatos
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: artefatos
        run: |
          # Uploads com vários caminhos guardam a pasta (ex.: dist/); traz tudo para a raiz.
          find . -mindepth 2 -type f -exec mv -f -t . {} +
          ls -la
          sha256sum *.tar.gz *.deb *.zip *.dmg > SHA256SUMS
          cat SHA256SUMS
      - name: Release (draft, a menos que publicar=true)
        working-directory: artefatos
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$REPO" --clobber *.tar.gz *.deb *.zip *.dmg SHA256SUMS THIRD-PARTY-LICENSES
            exit 0
          fi
          if [[ "$PUBLICAR" == "true" ]]; then
            MODO=()
            [[ "$TAG" == *-* ]] && MODO=(--prerelease)
            cat > ../notas.md <<NOTAS
          Pacotes gerados pela CI a partir do commit ${ALVO:0:7}, sem assinatura nem notarização.

          - **Linux:** \`.deb\` (Ubuntu/Debian) ou \`.tar.gz\` portátil (x86_64)
          - **Windows:** \`.zip\` portátil (x86_64); o SmartScreen avisa na primeira execução
          - **macOS:** \`.dmg\` ou \`.tar.gz\` com o \`Chess Studio.app\` (Apple Silicon); o Gatekeeper bloqueia a primeira abertura

          Como instalar e liberar os avisos: \`INSTALACAO.md\` dentro de cada pacote. Confira os downloads com \`SHA256SUMS\`.
          NOTAS
          else
            MODO=(--draft)
            echo "Draft gerado pela CI. Revise antes de publicar." > ../notas.md
          fi
          gh release create "$TAG" --repo "$REPO" "${MODO[@]}" --target "$ALVO" \
            --title "$TAG" --notes-file ../notas.md \
            *.tar.gz *.deb *.zip *.dmg SHA256SUMS THIRD-PARTY-LICENSES
