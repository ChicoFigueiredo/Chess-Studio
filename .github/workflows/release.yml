name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag do draft release (ex.: v0.1.0-rc1)'
        required: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libudev-dev libasound2-dev libwayland-dev libxkbcommon-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: THIRD-PARTY-LICENSES
        run: |
          cargo install cargo-about --locked --features cli
          scripts/gerar-licencas.sh
      - run: scripts/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.tar.gz
            dist/*.deb
            THIRD-PARTY-LICENSES

  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: .\scripts\package-windows.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip

  macos:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/*.tar.gz
            dist/*.dmg

  draft-release:
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefatos
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: artefatos
        run: |
          sha256sum *.tar.gz *.deb *.zip *.dmg > SHA256SUMS
          cat SHA256SUMS
      - name: Draft release (nunca publicado automaticamente)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        working-directory: artefatos
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$REPO" --clobber *.tar.gz *.deb *.zip *.dmg SHA256SUMS THIRD-PARTY-LICENSES
          else
            gh release create "$TAG" --repo "$REPO" --draft --target "${{ github.sha }}" \
              --title "$TAG" --notes "Draft gerado pela CI. Revise antes de publicar." \
              *.tar.gz *.deb *.zip *.dmg SHA256SUMS THIRD-PARTY-LICENSES
          fi
