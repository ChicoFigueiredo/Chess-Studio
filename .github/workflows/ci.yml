name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  linux:
    name: Linux (lint, testes, licenças)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Dependências do Bevy
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libudev-dev libasound2-dev libwayland-dev libxkbcommon-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev libvulkan1 mesa-vulkan-drivers xvfb
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Matriz P0 (referências)
        run: python3 scripts/gerar_matriz_p0.py --check
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Testes
        # xvfb dá um display virtual; o Vulkan cai no lavapipe (renderização por software).
        run: xvfb-run -a cargo test --workspace
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  build-test:
    name: ${{ matrix.nome }} (build + testes de domínio)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, nome: Windows }
          - { os: macos-latest, nome: macOS }
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (rust-toolchain.toml)
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Testes de domínio
        run: cargo test -p chess-core -p chess-game -p chess-store -p chess-uci -p chess-pgn -p chess-training -p chess-input
      - name: Build do chess-studio
        run: cargo build -p chess-studio
