# cargo-deny — ADR-0004: licença MIT OR Apache-2.0, nenhuma dependência GPL/AGPL/LGPL.
# Execute: cargo deny check licenses

[graph]
all-features = false

[licenses]
# Qualquer licença fora desta lista é negada (inclui GPL, AGPL e LGPL).
allow = [
    "MIT",
    "MIT-0", # variante permissiva do MIT, sem exigência de atribuição (usada por transitivas do Bevy)
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0", # webpki-roots: lista de raízes CA da Mozilla (dado permissivo) usada pelo ureq/rustls no download do Stockfish (#34)
]
confidence-threshold = 0.9

# Exceções por crate, só quando inevitáveis e justificadas aqui.
exceptions = []

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Dependências por caminho entre crates do workspace (`x.workspace = true`) não têm versão.
allow-wildcard-paths = true

[advisories]
# Cada ignore é justificado aqui.
ignore = [
    # ttf-parser sem manutenção: transitiva do winit (sctk-adwaita, só decoração de janela no
    # Linux/Wayland). Não processa entrada do usuário nem rede. Reavaliar ao atualizar o Bevy.
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser sem manutenção, sem correção disponível; ver comentário acima" },
]
